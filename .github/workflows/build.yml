name: Build MobileHouseArrest IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source
        run: |
          rm -rf source
          mkdir -p source
          unzip -q "MobileHouseArrestSafe-Xcode.zip" -d source

      - name: Find Xcode project
        id: project
        run: |
          PROJECT=$(find "$GITHUB_WORKSPACE/source" \
            -type d \
            -name "MobileHouseArrestSafe.xcodeproj" \
            -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "❌ Không tìm thấy Xcode project"
            exit 1
          fi

          echo "Project: $PROJECT"
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Show Xcode
        run: |
          xcodebuild -version

      - name: Build app
        run: |
          PROJECT="${{ steps.project.outputs.project }}"

          xcodebuild \
            -project "$PROJECT" \
            -target "MobileHouseArrestSafe" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Find generated APP
        id: app
        run: |
          echo "=== Searching for generated APP ==="

          APP=$(find "$GITHUB_WORKSPACE/source" \
            -type d \
            -name "MobileHouseArrestSafe.app" \
            -print -quit)

          if [ -z "$APP" ]; then
            echo "❌ Không tìm thấy MobileHouseArrestSafe.app"
            echo ""
            echo "=== APP files ==="
            find "$GITHUB_WORKSPACE/source" \
              -type d \
              -name "*.app" \
              -print

            exit 1
          fi

          echo "✅ Found:"
          echo "$APP"

          echo "app=$APP" >> "$GITHUB_OUTPUT"

      - name: Create APP copy
        run: |
          APP="${{ steps.app.outputs.app }}"

          rm -rf Output
          mkdir -p Output

          cp -R "$APP" "Output/MobileHouseArrestSafe.app"

          echo "=== APP created ==="
          ls -lah Output/
          du -sh Output/MobileHouseArrestSafe.app

      - name: Create IPA
        run: |
          rm -rf Payload
          mkdir Payload

          cp -R \
            "Output/MobileHouseArrestSafe.app" \
            "Payload/MobileHouseArrestSafe.app"

          zip -r \
            "MobileHouseArrest.ipa" \
            Payload

          echo "================================"
          echo "✅ IPA CREATED"
          echo "================================"

          ls -lh MobileHouseArrest.ipa

      - name: Upload APP
        uses: actions/upload-artifact@v4
        with:
          name: MobileHouseArrest-APP
          path: Output/MobileHouseArrestSafe.app

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MobileHouseArrest-IPA
          path: MobileHouseArrest.ipa
