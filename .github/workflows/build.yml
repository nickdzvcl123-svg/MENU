name: Build MobileHouseArrest IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source
        run: |
          rm -rf source
          mkdir -p source
          unzip -q "MobileHouseArrestSafe-Xcode.zip" -d source

      - name: Verify project
        run: |
          echo "=== Files ==="
          find source -maxdepth 4 -type f | sort

          echo "=== Xcode project ==="
          find source -name "*.xcodeproj" -print

      - name: Show Xcode version
        run: |
          xcodebuild -version

      - name: Build app
        run: |
          PROJECT=$(find "$GITHUB_WORKSPACE/source" -name "MobileHouseArrestSafe.xcodeproj" -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Không tìm thấy MobileHouseArrestSafe.xcodeproj"
            exit 1
          fi

          echo "Project: $PROJECT"

          xcodebuild \
            -project "$PROJECT" \
            -target "MobileHouseArrestSafe" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Find built app
        run: |
          echo "=== Built products ==="
          find "$RUNNER_TEMP/DerivedData" \
            -type d \
            -name "*.app" \
            -print

      - name: Create IPA
        run: |
          APP=$(find "$RUNNER_TEMP/DerivedData/Build/Products" \
            -type d \
            -name "MobileHouseArrest.app" \
            -print -quit)

          if [ -z "$APP" ]; then
            echo "ERROR: Không tìm thấy MobileHouseArrest.app"
            exit 1
          fi

          echo "APP: $APP"

          rm -rf Payload
          mkdir Payload

          cp -R "$APP" "Payload/MobileHouseArrest.app"

          rm -f MobileHouseArrest.ipa

          cd Payload
          zip -r ../MobileHouseArrest.ipa MobileHouseArrest.app
          cd ..

          echo "=== IPA created ==="
          ls -lh MobileHouseArrest.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MobileHouseArrest-IPA
          path: MobileHouseArrest.ipa
          if-no-files-found: error
